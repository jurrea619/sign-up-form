<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Sign-Up Form</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="sidebar">
    <!-- 
        Header element with Odin Logo span inline?
    -->
        <div id="header-wrapper">
            <img src="./odin-lined.png" alt="Odin Logo">
            <span class="header">ODIN</span>
        </div>
    </div>

    <div class="main">
    <!-- 
        3 containers (Text, Form, Submit/Login button and subtext)
        Middle container needs class to adjust background/shadow
    -->
        <div class="main-top">
            This is not a real online service! You know you need
            something like this in your life to help you realize
            your deepest dreams<br>
            Sign up <span class="italic-text">now</span> to get started<br>
            You <span class="italic-text">know</span> you want to.
        </div>

        <div class="main-form">
            <form action="" method="GET" id="sign-up-form">
                <h2>Let's Do This</h2>
                <div>
                    <label for="first-name">First Name</label>
                </div>
                <input type="text" name="first-name" id="first-name">

                <div>
                    <label for="last-name">Last Name</label>
                </div>
                <input type="text" name="last-name" id="last-name">
                
                <div>
                    <label for="email">Email</label>
                </div>
                <input type="email" name="email" id="email">

                <div>
                    <label for="telephone">Telephone</label>
                </div>
                <input type="tel" name="telephone" id="telephone">

                <div>
                    <label for="password">Password</label>
                </div>
                <input type="password" name="password" id="password">

                <div>
                    <label for="password-confirm">Confirm Password</label>
                </div>
                <input type="password" name="password-confirm" id="password-confirm">
            </form>
        </div>

        <div class="main-bottom">
            <!-- Submit button (link to form in attribute) and Login option -->
            <input type="submit" form="sign-up-form">
            Already a member? <a href="">Login</a> here
        </div>
    </div>
</body>
</html>
